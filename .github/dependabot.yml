version: 2
updates:
  - package-ecosystem: "swift"
    directory: "/BuildTools"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels: ["dependencies"]
  - package-ecosystem: "pip"
    directory: "/scripts"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels: ["dependencies"]
  - package-ecosystem: "github-actions"
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels: ["dependencies"]
    groups:
      github-actions:
        patterns: ["*"]
