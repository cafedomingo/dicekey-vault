name: Build tools
description: Resolves BuildTools and puts SwiftLint on PATH.
runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: BuildTools/.build
        key: build-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('BuildTools/Package.resolved') }}
    # The GITHUB_PATH entries are built here from $PWD and a fixed artifact path, with no untrusted input.
    - shell: bash
      run: | # zizmor: ignore[github-env]
        swift package --package-path BuildTools resolve
        # The bundle ships macOS and Linux builds; lint runs on Ubuntu, the Xcode jobs on macOS.
        BUNDLE="$PWD/BuildTools/.build/artifacts/swiftlintplugins/SwiftLintBinary/SwiftLintBinary.artifactbundle"
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) echo "$BUNDLE/linux/amd64" >> "$GITHUB_PATH" ;;
          Linux-ARM64) echo "$BUNDLE/linux/arm64" >> "$GITHUB_PATH" ;;
          *) echo "$BUNDLE/macos" >> "$GITHUB_PATH" ;;
        esac
