name: Build

# Every PR, whatever its base, so stacked PRs are checked. Pushes only to main: a branch's push
# and its PR would both run, and concurrency can't merge them since their refs differ.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/build-tools
      - name: Install linters
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install -r scripts/requirements-lint.txt
          echo "$RUNNER_TEMP/lint/bin" >> "$GITHUB_PATH"
      - name: swift-format
        # Not scripts: swift-format folds the comments after a shebang into it, a line per run.
        run: swift format lint --strict --recursive DiceKeyVault Packages Tests BuildTools/Package.swift
      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging
      - name: ruff check
        run: ruff check --output-format github scripts
      - name: ruff format
        run: ruff format --check scripts
      - name: shellcheck
        run: shellcheck scripts/*.sh scripts/*/*.sh
      # Post-quantum age needs 1.3, newer than Ubuntu's: the release tarball, pinned by the hash
      # it had when its Sigsum proof was checked.
      - name: Key kinds
        env:
          AGE_VERSION: v1.3.2
          AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends wireguard-tools
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/age.tar.gz" \
            "https://github.com/FiloSottile/age/releases/download/$AGE_VERSION/age-$AGE_VERSION-linux-amd64.tar.gz"
          echo "$AGE_SHA256  $RUNNER_TEMP/age.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/age.tar.gz" --directory "$RUNNER_TEMP"
          python3 -m venv "$RUNNER_TEMP/kinds"
          "$RUNNER_TEMP/kinds/bin/pip" install -r scripts/requirements.txt
          PATH="$RUNNER_TEMP/age:$PATH" "$RUNNER_TEMP/kinds/bin/python" scripts/derive-kinds.py --tools
      - name: actionlint
        uses: kjanat/actionlint@08bb2c4f0d039744455b87aef1c647fb8b66d37b # v1.17.0

  # PRs that change only docs/, scripts/ and top-level Markdown skip the macOS jobs; XcodeGen
  # bundles Markdown elsewhere. An `if:` rather than a path filter, which leaves required checks
  # pending. If `changes` fails or is skipped, as on a push to main, every job runs.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      app: ${{ steps.files.outputs.app }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
            --jq '.[] | .filename, .previous_filename // empty')
          if grep -qvE '^(docs|scripts)/|^[^/]*\.md$' <<< "$files"; then app=true; else app=false; fi
          echo "app=$app" >> "$GITHUB_OUTPUT"

  # One job: each package takes about a minute, and a macOS runner half that just to start.
  # Release builds: the scanner's photo corpus takes minutes at -Onone and seconds at -O.
  packages:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derivation
        working-directory: Packages/Derivation
        run: swift test -c release -Xswiftc -enable-testing --parallel
      - name: ReadDiceKey
        working-directory: Packages/ReadDiceKey
        run: swift test -c release -Xswiftc -enable-testing --parallel

  unused-code:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/build-tools
      - name: Generate project
        run: swift run --package-path BuildTools xcodegen generate
      - name: Build iOS app (simulator)
        run: |
          set -o pipefail
          xcodebuild build -project DiceKeyVault.xcodeproj -scheme DiceKeyVault \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM= 2>&1 | tee build-ios.log | grep --line-buffered -E 'error:|warning: unre|^Ld |BUILD|\*\*' || true
          grep -q 'BUILD SUCCEEDED' build-ios.log
      - name: Unused code (swiftlint analyze)
        run: |
          swiftlint analyze --strict --config .swiftlint.yml --config .swiftlint-analyze.yml \
            --compiler-log-path build-ios.log --reporter github-actions-logging
      - name: Upload logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unused-code-logs
          path: "*.log"
          retention-days: 7

  catalyst:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/build-tools
      - name: Generate project
        run: swift run --package-path BuildTools xcodegen generate
      - name: Build Mac app (Catalyst)
        run: |
          set -o pipefail
          xcodebuild build -project DiceKeyVault.xcodeproj -scheme DiceKeyVault \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM= 2>&1 | tee build-catalyst.log | grep --line-buffered -E 'error:|^Ld |BUILD|\*\*' || true
          grep -q 'BUILD SUCCEEDED' build-catalyst.log
      - name: Upload logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalyst-logs
          path: "*.log"
          retention-days: 7

  app-tests:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.app != 'false' }}
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/build-tools
      - name: Generate project
        run: swift run --package-path BuildTools xcodegen generate
      - name: Pick a simulator
        run: |
          # The newest iPhone, by UDID: names repeat across runtimes.
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys,re
          devices=json.load(sys.stdin)["devices"]
          best=None
          for runtime,devs in devices.items():
              m=re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m: continue
              version=(int(m.group(1)),int(m.group(2)))
              for d in devs:
                  if d.get("isAvailable") and d["name"].startswith("iPhone"):
                      key=(version,d["name"])
                      if best is None or key>best[0]: best=(key,d["udid"])
          print(best[1] if best else "")')
          echo "Simulator: $UDID"
          test -n "$UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
      - name: Build for testing
        run: |
          set -o pipefail
          # Ad hoc, not unsigned: unsigned, keychain calls fail with errSecMissingEntitlement.
          xcodebuild build-for-testing -project DiceKeyVault.xcodeproj -scheme DiceKeyVault \
            -destination "platform=iOS Simulator,id=$UDID" \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= 2>&1 | tee build-ios.log | grep --line-buffered -E 'error:|warning: unre|^Ld |BUILD|\*\*' || true
          grep -q 'BUILD SUCCEEDED' build-ios.log
      - name: Test without building
        run: |
          set -o pipefail
          xcodebuild test-without-building -project DiceKeyVault.xcodeproj -scheme DiceKeyVault \
            -destination "platform=iOS Simulator,id=$UDID" \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= 2>&1 | tee test-ios.log | grep --line-buffered -E 'error:|Test Case|Test Suite|passed|failed|\*\*' || true
          grep -q 'TEST EXECUTE SUCCEEDED' test-ios.log
      - name: Upload logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-tests-logs
          path: |
            *.log
            ~/Library/Logs/CoreSimulator/CoreSimulator.log
          retention-days: 7
